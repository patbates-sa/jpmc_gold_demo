version: 2

sources:
  - name: gold
    description: >
      Synthetic Gold-layer tables generated by sql/01_create_and_generate.sql.
      Both are partitioned on ingest-optimized keys. The join key
      department_name is deliberately NOT a partition column on either side.
    catalog: jpmc_cib_demo
    schema: gold_demo
    tables:
      - name: gold_employee
        description: Large side. Partitioned on (department_number, employee_id_bucket).
        columns:
          - name: employee_id
            description: Grain. Unique key for the incremental merge.
            tests: [unique, not_null]
          - name: department_name
            description: Join key. Not a partition column.
            tests:
              - not_null
              - relationships:
                  to: source('gold', 'gold_department')
                  field: department_name
      - name: gold_department
        description: Small side. Partitioned on department_number. Many-to-one.
        columns:
          - name: department_name
            description: Join key. Unique here, which is what makes the join many-to-one.
            tests: [unique, not_null]
